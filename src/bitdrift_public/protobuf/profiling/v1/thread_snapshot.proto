syntax = "proto3";
package bitdrift_public.protobuf.profiling.v1;

import "bitdrift/public/unary/issues/v1/crash.proto";

message ThreadSnapshot {
  // One stack per thread, leaf-to-root: sampled PC first, then return addresses.
  // Empty frame lists represent unavailable stacks.
  .bitdrift.public.unary.issues.v1.Report.ThreadDetails thread_details = 1;
  // Only images referenced by those frames.
  repeated .bitdrift.public.unary.issues.v1.Report.BinaryImage binary_images = 2;
}
