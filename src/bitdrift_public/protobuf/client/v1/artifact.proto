syntax = "proto3";

package bitdrift_public.protobuf.client.v1;

import "bitdrift_public/protobuf/client/v1/api.proto";
import "bitdrift_public/protobuf/client/v1/feature_flag.proto";
import "bitdrift_public/protobuf/logging/v1/payload.proto";
import "bitdrift_public/protobuf/workflow/v1/workflow.proto";
import "google/protobuf/timestamp.proto";

// Facts about an Android app process, recorded once at SDK startup, that let a later
// system-triggered profile be attributed to a crash report from that process. The SDK stores the
// encoded message in the report's `crash_profile_source` field and in the process-state summary
// that Android returns with the process's exit record. It is never an API request field.
message CrashProfileSource {
  // Random 16-byte UUID identifying this process run.
  bytes run_id = 1;

  uint32 pid = 2;

  // Settings.Global.BOOT_COUNT when the process started.
  uint64 boot_count = 3;

  // Process start time in CLOCK_BOOTTIME nanoseconds.
  uint64 process_start_elapsed_ns = 4;

  // A paired CLOCK_REALTIME / CLOCK_BOOTTIME sample taken at SDK startup. Their difference is the
  // boot epoch compared with a trace's clock snapshots and converts report wall times to BOOTTIME.
  int64 wall_ns = 5;
  uint64 elapsed_ns = 6;
}

enum StorageFormat {
  // The file was checksummed when it was copied into the artifact upload queue, so we can validate the checksum on upload.
  CHECKSUMMED = 0;
  // The file was stored on disk without being checksummed. This should only be used if the file already has
  // internal checksumming like zlib.
  RAW = 1;
}

// the upload manager to coordinate intents and uploads.
message ArtifactUploadIndex {
  // Chunk ownership uses the same index commit/recovery as whole-file artifacts. A separate entry
  // field prevents an older SDK from interpreting a chunk or manifest as a complete artifact payload.
  message ChunkedArtifact {
    // Payload-free Begin/resume template: no attempt UUID, contents or current chunk index.
    // The planned M5 uploader retains this full manifest locally but derives thin chunk/Query
    // requests from identity and logical size, adding only attempt UUID and chunk index/bytes.
    UploadArtifactRequest request = 1;
  }

  message Artifact {
    // Name of the file to upload.
    string name = 1;
    // The time associated with this artifact, e.g. when the data was captured.
    google.protobuf.Timestamp time = 2;
    // Whether this artifact requires intent negotiation. If intent negotiation resulted
    // in us rejecting the upload, the artifact will be removed from the local cache, so
    // this being true means that the file should be uploaded.
    bool pending_intent_negotiation = 3;

    // Additional metadata about the artifact beyond what is available in the file itself. This is sent as part of the intent negotation process to help the server make a decision about whether to accept the upload or not.
    // For issue reports this corresponds to the "fields" associated with the issue report.
    map<string, bitdrift_public.protobuf.logging.v1.Data> metadata = 5;

    // The session ID associated with this artfact, if applicable. This will be empty for artifacts that are not associated with a session, like state snapshots that may span sessions.
    string session_id = 6;

    // The feature flags that were active when this artifact was captured. This is used by issue reports to allow the feature flags to be captured independently of the report.
    repeated FeatureFlag feature_flags = 7;

    // The type of the artifact, e.g. "client_report", "state_snapshot", etc. This is used by the server to determine how to process the artifact. For backwards compatibility, if this is absent the artifact is an issue report.
    optional string type_id = 8;

    // The storage format of the artifact, which determines whether we apply checksum validation during processing.
    StorageFormat storage_format = 9;

    // Client workflow continuations that should be evaluated when this report is processed.
    // Only populated for issue-report artifacts; other artifact types must leave this unset.
    optional bitdrift_public.protobuf.workflow.v1.WorkflowReportHandoff workflow_report_handoff = 10;

    // The remote command that produced this artifact. This survives local uploader restarts.
    optional string command_id = 11;

    // The encoding of the retained artifact payload. This survives local uploader restarts.
    ArtifactPayloadEncoding payload_encoding = 12;

    // The MIME type of a workflow/direct command attachment or crash profile. This survives
    // local uploader restarts; workflow attachments also retain it before ownership transfers.
    optional string content_type = 13;

    // Report links for type_id = "crash_profile", retained across uploader restarts.
    CrashProfileMetadata crash_profile = 14;
  }

  // List of files, in order of time, that are pending upload.
  repeated Artifact artifact = 1;

  // M1 defines metadata only. M2 wires shared atomic/fsynced commits, recovery and payload cleanup.
  // Retain all chunks until finalized or explicit rejection.
  repeated ChunkedArtifact chunked_artifact = 2;
}

// Durable local ownership and retirement state for a workflow attachment.
message WorkflowAttachmentState {
  uint64 admitted_at_micros = 1;
  // Absent until the outcome log is recorded; restart uses admission time as a fallback.
  optional uint64 occurred_at_micros = 2;
  optional string content_type = 3;
  bool uploaded = 4;
}
