syntax = "proto3";

package bitdrift_public.protobuf.workflow.v1;

import "bitdrift_public/protobuf/logging/v1/payload.proto";
import "google/protobuf/descriptor.proto";
import "validate/validate.proto";

// Compatibility requirements for a well-known command or one of its arguments.
// Argument requirements intersect with the command's requirements only when the argument is
// supplied or filled from a default. Omitted argument requirements inherit the command's
// requirements; they never widen them.
message DeviceCommandAvailability {
  enum Platform {
    PLATFORM_UNSPECIFIED = 0;
    ANDROID = 1;
    APPLE = 2;
  }

  message PlatformSupport {
    Platform platform = 1 [(validate.rules).enum.defined_only = true];
    // Inclusive OS release floor, not an Android API level. Numeric components are compared with
    // missing trailing components treated as zero. Apple denotes the entire platform family.
    // Required on commands; omission on an argument inherits the command's floor for this platform.
    optional string min_os_version = 2 [(validate.rules).string = {
      min_len: 1
      max_len: 64
    }];
    // Inclusive shared-core config capability floor. A native SDK's config version equals its
    // SemVer MINOR component, so a floor of 49 requires SDK minor 49 or later (for example, 0.49.x).
    // Required for every declared platform, including argument-specific availability overrides.
    int64 min_config_version = 3 [(validate.rules).int64.gt = 0];
  }

  // Commands declare a nonempty list without duplicate platforms. An empty argument list inherits
  // command platforms; an explicit argument list must be a subset of its command's platforms.
  repeated PlatformSupport supported_platforms = 1 [(validate.rules).repeated.max_items = 2];
}

// Defines one named argument accepted by a device command. Invocation values are supplied in
// WorkflowCommandSelector.arguments using this name and type.
message DeviceCommandArgumentDefinition {
  // The corresponding variant of bitdrift_public.protobuf.logging.v1.Data.
  enum Type {
    // Not a valid argument type for a command definition.
    TYPE_UNSPECIFIED = 0;
    // Data.string_data.
    STRING = 1;
    // Data.binary_data.
    BINARY = 2;
    // Data.int_data (an unsigned 64-bit integer).
    UINT64 = 3;
    // Data.double_data.
    DOUBLE = 4;
    // Data.sint_data (a signed 64-bit integer).
    INT64 = 5;
    // Data.bool_data.
    BOOL = 6;
  }

  // The name used as the key in the command invocation's arguments map.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];
  // The required value type; TYPE_UNSPECIFIED is not a usable definition.
  Type type = 2 [(validate.rules).enum.defined_only = true];
  // A human-readable explanation of the argument for command authors.
  string description = 3 [(validate.rules).string = {
    min_len: 1
    max_len: 1000
  }];
  // Whether the effective invocation may omit this argument. A default satisfies a required
  // argument, so callers may omit it even when optional is false.
  bool optional = 4;
  // Additional compatibility requirements for a supplied or default-filled well-known command
  // argument. Unsupported invocations are not delivered; arguments are never silently removed.
  // Not accepted on custom registered commands. Absence inherits command availability.
  DeviceCommandAvailability availability = 5;
  // Typed value used by the server when the argument key is absent. Its Data variant must match
  // type; an unset variant, map, or array is invalid. Explicit values always win, including zero,
  // false, and empty values. A default satisfies a missing required argument. Absence means no
  // default, not a zero value. SDK safety limits still apply to the effective value.
  bitdrift_public.protobuf.logging.v1.Data default_value = 6;
}

message WellKnownCommandOptions {
  string key = 1;
  string description = 2;
  repeated DeviceCommandArgumentDefinition argument_definitions = 3;
  bool is_privacy_sensitive = 4;
  // Required compatibility declaration for every nonzero well-known command.
  DeviceCommandAvailability availability = 5;
}

extend google.protobuf.EnumValueOptions {
  WellKnownCommandOptions well_known_command_options = 51000;
}

// Commands implemented by the client without application registration.
enum WellKnownCommandType {
  TYPE_UNSPECIFIED = 0;
  // Requests the device's buffered logs.
  //
  // The attachment is an `application/json` array of log records, assembled in upload order,
  // including an empty array when no logs were captured. Stored batches are decompressed before
  // JSON assembly; the download does not preserve their original zstd frames. HTTP compression can
  // be negotiated separately; decode according to the response's `Content-Encoding`.
  // There is no processed representation. This command is not supported in workflows.
  DUMP_DEVICE_BUFFER = 1 [(well_known_command_options) = {
    key: "dump_device_buffer"
    description: "Requests the device's buffered logs."
    availability: {
      supported_platforms: [
        {
          platform: ANDROID
          min_os_version: "6.0"
          min_config_version: 49
        },
        {
          platform: APPLE
          min_os_version: "15.0"
          min_config_version: 49
        }
      ]
    }
  }];
  // Captures the device's current screen as a JPEG image.
  //
  // The original attachment has MIME type `image/jpeg` and uses `Content-Encoding: zstd` when
  // downloaded. Decode the HTTP content encoding before treating the contents as a JPEG.
  // There is no processed representation.
  TAKE_SCREENSHOT = 2 [(well_known_command_options) = {
    key: "take_screenshot"
    is_privacy_sensitive: true
    description: "Captures the device's current screen as a JPEG image."
    availability: {
      supported_platforms: [
        {
          platform: ANDROID
          min_os_version: "8.0"
          min_config_version: 49
        },
        {
          platform: APPLE
          min_os_version: "15.0"
          min_config_version: 49
        }
      ]
    }
  }];
  // Captures a Perfetto stack sampling trace of the application's process.
  //
  // The original attachment has MIME type `application/vnd.bitdrift.perfetto-trace`. Use
  // `?variant=raw` to download that original trace without waiting for processing. The default
  // download and `?variant=processed` return a processed Perfetto TAR bundle when ready; after HTTP
  // zstd decompression, extract the TAR rather than interpreting the entire bundle as a raw trace.
  //
  // Processing-pending downloads return HTTP 409 with `Retry-After: 2`. If processing fails, the
  // default download returns the original trace with HTTP 200, while `?variant=processed` returns
  // HTTP 422 with `error_code` and `diagnostics`. Inspect attachment `/status` for processing state,
  // availability, and quality diagnostics; `partial` describes capture/processing limitations,
  // not a trace that is still uploading. Downloads include
  // `X-Bitdrift-Attachment-Disposition: raw` or `processed`.
  STACK_SAMPLING_TRACE = 3 [(well_known_command_options) = {
    key: "stack_sampling_trace"
    description: "Captures a Perfetto stack sampling trace of the application's process."
    availability: {
      supported_platforms: [
        {
          platform: ANDROID
          min_os_version: "15"
          min_config_version: 50
        }
      ]
    }
    argument_definitions: [
      {
        name: "duration_ms"
        type: INT64
        description: "How long to sample, in milliseconds."
        default_value: {sint_data: 3000}
      },
      {
        name: "frequency_hz"
        type: INT64
        description: "Sampling frequency in Hz."
        default_value: {sint_data: 100}
      },
      {
        name: "buffer_size_kb"
        type: INT64
        description: "Trace buffer size in KB."
        default_value: {sint_data: 2048}
      }
    ]
  }];
}

// Selects one locally registered or built-in workflow command.
message WorkflowCommandSelector {
  // Selects a command registered by the embedding application.
  message RegisteredCommand {
    string registered_command_id = 1 [(validate.rules).string.min_len = 1];
  }

  // A command implemented by the client.
  message BuiltinCommand {
    WellKnownCommandType type = 1 [(validate.rules).enum.defined_only = true];
  }

  oneof command_selector {
    option (validate.required) = true;

    // A strongly typed command implemented by the client workflow runtime.
    BuiltinCommand builtin_command = 1;

    // A command implemented by the embedding application.
    RegisteredCommand registered_command = 2;
  }

  // Named typed arguments passed to the selected command. The server fills absent keys from the
  // command's typed defaults before delivery; explicit values always win. Required arguments need
  // either an explicit value or a default. Default-filled arguments also impose their availability
  // requirements. Direct commands persist the effective values at submission; workflow defaults
  // are resolved from current command definitions when client configurations are emitted.
  map<string, bitdrift_public.protobuf.logging.v1.Data> arguments = 3;
}
