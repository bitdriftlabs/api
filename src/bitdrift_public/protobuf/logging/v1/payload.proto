syntax = "proto3";

package bitdrift_public.protobuf.logging.v1;

message BinaryData {
  // Optional type identifier for binary data.
  optional string type = 1;
  bytes payload = 2;
}

// One-of for a canonical string data field
message Data {
  oneof data_type {
    string string_data = 1;
    BinaryData binary_data = 2;
    uint64 int_data = 3;
    double double_data = 4;
    int64 sint_data = 5;
    bool bool_data = 6;
    MapData map_data = 7;
    ArrayData array_data = 8;
  }
}

message MapData {
  map<string, Data> entries = 1;
}

message ArrayData {
  repeated Data items = 1;
}

enum LogType {
  // Normal logs, from application code.
  NORMAL = 0;
  // Session replay logs.
  REPLAY = 1;
  // Application lifecycle logs.
  LIFECYCLE = 2;
  // Resource monitoring logs, such as memory, CPU, and battery consumption.
  RESOURCE = 3;
  // Internal SDK logs.
  INTERNAL_SDK = 4;
  // View lifecycle.
  VIEW = 5;
  // Device state.
  DEVICE = 6;
  // UX interaction.
  UX = 7;
  // Span start/end pairs.
  SPAN = 8;
}

// Describes an attachment produced by a command, not the attachment bytes or a remote-upload
// confirmation. In particular, workflow metadata can exist before upload completes. Downloads
// return complete attachments, not growing prefixes of progressive uploads.
message CommandAttachment {
  // Identifies the command lifecycle and how to locate its attachment.
  enum Source {
    // The lifecycle is unknown; do not infer a download endpoint from the artifact ID alone.
    UNSPECIFIED = 0;
    // Download with GET /v1/workflow-commands/{artifact_id}, using SESSION_READ. Local completion
    // does not confirm upload: capture/flush the referencing outcome log and use bounded retries
    // for HTTP 404. Append /status to check availability and optional processing.
    WORKFLOW = 1;
    // Poll GetDeviceCommand using the separately returned direct command ID. After success with
    // an attachment, download with GET /v1/device-commands/{command_id}/attachment. This
    // metadata's artifact_id is not the command_id required by that route.
    DIRECT_COMMAND = 2;
  }

  // The UUID identifying the artifact, not a direct command ID. Use source to choose the download
  // flow; metadata alone does not guarantee remote availability.
  string artifact_id = 1;
  // The MIME type of the original artifact. Read the download response's Content-Type for the
  // selected representation, which can differ after processing or a failure fallback.
  string content_type = 2;
  // The original artifact size reported by the producer, not remote-upload progress or the
  // encoded download size. Processing and HTTP compression can change the response size.
  uint64 size_bytes = 3;
  // The command lifecycle responsible for uploading the artifact.
  Source source = 4;
}

message Log {
  message Field {
    string key = 1;
    Data value = 2;
  }

  message CompressedContents {
    Data message = 1;
    repeated Field fields = 2;
  }

  // The timestamp in unix microseconds indicating when this log was recorded.
  // NOTE: This was intentionally chosen to be the first field for trivial extraction without
  //       parsing the full message.
  uint64 timestamp_unix_micro = 1;
  // The log level.
  uint32 log_level = 2;
  // The message associated with the log.
  Data message = 3;
  // An optional list of high cardinality fields.
  repeated Field fields = 4;
  // The ID of the session associated with this log.
  string session_id = 5;
  // The list of action IDs that were triggered by this log line.
  repeated string action_ids = 6;
  // The type of log.
  LogType log_type = 7;
  // The list of stream IDs that were associated with this streaming log.
  // This should only be set when the log has been streamed.
  repeated string stream_ids = 8;
  // If set, this is a zlib compressed `CompressedContents` message containing the log's
  // message and fields. In this case the message and fields above will be empty and should be
  // synthetically reconstructed by decompressing this field.
  bytes compressed_contents = 9;
  // An attachment produced by a command, independent of the compressed log contents.
  CommandAttachment command_attachment = 10;
}
