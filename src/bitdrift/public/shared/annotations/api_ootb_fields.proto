syntax = "proto3";

package bitdrift.public.shared.annotations;

import "google/protobuf/descriptor.proto";
import "validate/validate.proto";

// Describes a well-known log field attached to an OOTB event. These fields are available for
// matching via `generic_match` in workflow definitions.
message OotbFieldDescriptor {
  // The log field key (e.g., "_duration_ms").
  string key = 1;

  // Human-readable description of what this field represents.
  string description = 2;

  // The value type carried in the log field. All values are transmitted as strings; this indicates
  // the semantic type for parsing and comparison.
  .bitdrift.public.shared.annotations.OotbFieldType type = 3;

  // Optional unit of measurement (e.g., "ms", "KB", "percent"). Empty when not applicable.
  string unit = 4;

  // Which platform emits this field. Defaults to ALL (all supported platforms).
  .bitdrift.public.shared.annotations.OotbFieldPlatform platform = 5;

  // Human-readable label. Empty for documented fields not offered in the field selector.
  string title = 6;

  // Supported comparison operators, in preferred order.
  repeated .bitdrift.public.shared.annotations.OotbFieldOperator supported_operators = 7;

  // Supported aggregations: group, histogram, counter, or averageCount.
  repeated .bitdrift.public.shared.annotations.OotbFieldAggregation suitable_for = 8;

  // Predefined values and their display labels. Empty for free-form values.
  repeated .bitdrift.public.shared.annotations.OotbFieldChoice choices = 9;

  // Overrides the semantic type for comparison, preserving existing matching semantics.
  optional .bitdrift.public.shared.annotations.OotbFieldType comparison_type = 10;

  // A representative raw log-field value, for explaining the field in selector UI.
  // This is an example, not a constraint on values accepted by the matcher.
  string example_value = 11;

  // References a canonical descriptor on OotbCommonField. Other populated fields are limited to
  // platform and example_value overrides. UNSPECIFIED means this is a complete inline field.
  .bitdrift.public.shared.annotations.OotbCommonField common_field = 12;
}

// A predefined field value and its display label.
message OotbFieldChoice {
  string value = 1;

  string title = 2;
}

// Operators available to a field in the matcher UI. These mirror workflow operators without
// introducing a dependency from shared annotations back to the workflow schema.
enum OotbFieldOperator {
  OOTB_FIELD_OPERATOR_EQUAL = 0;
  OOTB_FIELD_OPERATOR_NOT_EQUAL = 1;
  OOTB_FIELD_OPERATOR_GREATER_THAN = 2;
  OOTB_FIELD_OPERATOR_GREATER_THAN_OR_EQUAL = 3;
  OOTB_FIELD_OPERATOR_LESS_THAN = 4;
  OOTB_FIELD_OPERATOR_LESS_THAN_OR_EQUAL = 5;
  OOTB_FIELD_OPERATOR_REGEX = 6;
  OOTB_FIELD_OPERATOR_IN = 7;
  OOTB_FIELD_OPERATOR_NOT_IN = 8;
  OOTB_FIELD_OPERATOR_NOT_REGEX = 9;
  OOTB_FIELD_OPERATOR_WILDCARD = 10;
  OOTB_FIELD_OPERATOR_NOT_WILDCARD = 11;
  OOTB_FIELD_OPERATOR_SET = 12;
  OOTB_FIELD_OPERATOR_NOT_SET = 13;
}

// Chart capabilities advertised for an OOTB field.
enum OotbFieldAggregation {
  OOTB_FIELD_AGGREGATION_GROUP = 0;
  OOTB_FIELD_AGGREGATION_HISTOGRAM = 1;
  OOTB_FIELD_AGGREGATION_COUNTER = 2;
  OOTB_FIELD_AGGREGATION_AVERAGE_COUNT = 3;
}

// The semantic type of a well-known field value.
enum OotbFieldType {
  // A string value (default).
  OOTB_FIELD_TYPE_STRING = 0;
  // An integer value encoded as a string (e.g., "200", "42").
  OOTB_FIELD_TYPE_INT = 1;
  // A floating-point value encoded as a string (e.g., "72.431", "0.85").
  OOTB_FIELD_TYPE_FLOAT = 2;
  // A boolean value encoded as "1" (true) or "0" (false).
  OOTB_FIELD_TYPE_BOOL = 3;
  // A semantic version encoded as a string.
  OOTB_FIELD_TYPE_SEMVER = 4;
}

// Platform applicability for a well-known field.
enum OotbFieldPlatform {
  // Emitted on all platforms supporting the event.
  OOTB_FIELD_PLATFORM_ALL = 0;
  // Emitted only on Android.
  OOTB_FIELD_PLATFORM_ANDROID = 1;
  // Emitted only on iOS/Apple.
  OOTB_FIELD_PLATFORM_IOS = 2;
}

