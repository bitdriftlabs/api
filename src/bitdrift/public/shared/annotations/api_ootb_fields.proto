// Category of an OOTB event.
enum OotbEventCategory {
  // Invalid for an OOTB event.
  OOTB_EVENT_CATEGORY_UNSPECIFIED = 0;
  // General SDK events.
  OOTB_EVENT_CATEGORY_GENERAL = 1;
  // Events originating from a WebView.
  OOTB_EVENT_CATEGORY_WEBVIEW = 2;
}

// Structured metadata for an OOTB condition type enum value, describing the event and its
// well-known log fields.
message OotbEventMetadata {
  // The well-known log fields this event carries, available for matching via generic_match.
  repeated .bitdrift.public.shared.annotations.OotbFieldDescriptor well_known_fields = 1;

  // Human-readable event label.
  string title = 2;

  // Describes when the event is emitted.
  string description = 3;

  // Category used to group the event in catalogs.
  .bitdrift.public.shared.annotations.OotbEventCategory category = 4 [(validate.rules).enum = {
    defined_only: true
    not_in: [0]
  }];
}

extend .google.protobuf.EnumValueOptions {
  .bitdrift.public.shared.annotations.OotbEventMetadata ootb_event_metadata = 50002;
}

// Fields available through generic matching on OOTB events.
message OotbDefaultFieldMetadata {
  repeated .bitdrift.public.shared.annotations.OotbFieldDescriptor fields = 1;
}

extend .google.protobuf.MessageOptions {
  .bitdrift.public.shared.annotations.OotbDefaultFieldMetadata ootb_default_field_metadata = 50004;
}
