syntax = "proto3";

package bitdrift.public.stream.bdtail.v1;

import "bitdrift_public/protobuf/client/v1/matcher.proto";
import "bitdrift_public/protobuf/logging/v1/payload.proto";
import "bitdrift_public/protobuf/matcher/v1/log_matcher.proto";
import "validate/validate.proto";

// Starts a live stream of logs captured from devices that match the request target.
//
// This is a server-streaming RPC. The client sends one request and reads log batches until the
// stream ends. The service supports native gRPC and Connect streaming; JSON transcoding is not
// supported for this method.
service BDTail {
  // Streams structured protobuf logs captured from devices matching the supplied target.
  //
  // The stream ends with a canonical gRPC or Connect status when the request is invalid, tailing
  // is unavailable, or the connection closes. Empty log batches are not application heartbeats.
  rpc TailLogs(.bitdrift.public.stream.bdtail.v1.TailLogsRequest) returns (stream .bitdrift.public.stream.bdtail.v1.TailLogsResponse);
}

message TailLogsRequest {
  oneof target {
    option (validate.required) = true;
    // Matches one or more connected clients using static device metadata.
    .bitdrift_public.protobuf.client.v1.Matcher client_matcher = 1;

    // A six-digit code previously exchanged for a device identifier.
    string device_code = 2 [(validate.rules).string = {
      min_len: 6
      max_len: 6
    }];
  }

  // Optionally filters logs from matching clients. If omitted, all captured logs are streamed.
  .bitdrift_public.protobuf.matcher.v1.LogMatcher log_matcher = 3;
}

message TailLogsResponse {
  // A batch of structured protobuf logs.
  repeated .bitdrift_public.protobuf.logging.v1.Log logs = 1 [(validate.rules).repeated.max_items = 1000];
}
