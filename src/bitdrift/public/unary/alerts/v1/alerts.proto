enum ThresholdCondition {
  ABOVE = 0;
  BELOW = 1;
}

// An alert definition global for an individual metric aggregated ID. This is shared across N
// workflows/charts if all of those workflows/charts refer to the same aggregated ID.
//
// By default, searches for a qualifying run of data points anywhere within window. Select
// WINDOW_ROLLUP to compare one statistic over the trailing window instead. All configured
// threshold, device, and denominator-share conditions must hold for the same group and interval.
//
// Example: to alert on a version's failure rate above 0.05% over the trailing hour, with at least
// 10 affected devices and more than 1% of app-open events, use threshold: 0.0005, condition: ABOVE,
// window: "3600s", evaluation_mode: WINDOW_ROLLUP, unique_device_threshold: 10,
// rate_options: {unique_device_source: NUMERATOR, denominator_share_threshold: 0.01},
// limit_strategy: {all_groups: {}}. Omit aggregation_window and consecutive_data_points.
//
// With 11 failures, 20,000 opens, 10 affected devices, and 1,000,000 total matching opens, the
// rate is 0.055% and the share is 2%, so this example fires. Exactly 0.05% does not exceed the
// rate threshold; exactly 1% does not exceed the share threshold. Repeated failures from the
// same device count once toward the device threshold.
message BasicAlertConfig {
  // Selects how values within the evaluation window are compared.
  enum EvaluationMode {
    // Searches for any qualifying run of consecutive data points within window. Each point
    // must independently satisfy all gates. This is the default and preserves existing behavior:
    // with consecutive_data_points omitted, a single bad minute can trigger a one-hour alert.
    DATA_POINTS = 0;
    // Compares one statistic for the entire trailing window: counter sum, rate or average-count
    // ratio of sums, or the configured histogram percentile across all samples in the interval.
    // Device counts are deduplicated across the interval, not added across buckets.
    //
    // Evaluations end at the latest completed source-data bucket after the configured ingestion
    // delay, so the data cutoff can lag wall-clock time. For a one-hour window with minute source
    // data and an effective evaluation time of 12:35, uses [11:35, 12:35), not [11:00, 12:00).
    // aggregation_window must be omitted; consecutive_data_points must be omitted or 1.
    //
    // For example, 2 failures in 1,000 opens followed by 0 failures in 19,000 opens produce
    // 2 / 20,000 = 0.01%, not the mean of the two bucket rates (0.1%).
    WINDOW_ROLLUP = 1;
  }

  // Additional eligibility and device-population settings for rate time series.
  // Rejected for counters, histograms, and average-count series. An omitted or empty message
  // preserves denominator-device counting and adds no denominator-share condition.
  message RateOptions {
    // The rate side whose devices are compared with unique_device_threshold.
    enum UniqueDeviceSource {
      // Devices contributing denominator events, such as devices opening the app. The default.
      DENOMINATOR = 0;
      // Devices contributing numerator events, such as devices reporting failures. A numerator
      // device threshold requires device tracking on the workflow time series. This counts
      // affected devices, not reports.
      NUMERATOR = 1;
    }

    // Selects the population for unique_device_threshold without changing the event-count rate.
    // Defaults to DENOMINATOR. In DATA_POINTS mode, devices are counted separately per point;
    // in WINDOW_ROLLUP, they are deduplicated across the whole interval for each group.
    // Device tracking must be enabled to use a numerator device threshold.
    .bitdrift.public.unary.alerts.v1.BasicAlertConfig.RateOptions.UniqueDeviceSource unique_device_source = 1 [(validate.rules).enum = {defined_only: true}];

    // Requires a group's denominator event count divided by all matching denominator events
    // to be strictly greater than this fraction. Must be finite and between 0 and 1 inclusive.
    // Omission disables this gate. 0.01 means more than 1%, not at least 1%.
    //
    // Uses the same bucket as each DATA_POINTS comparison, or the entire WINDOW_ROLLUP interval.
    // The population respects workflow, app, platform, and data filters, but is calculated before
    // top-K, identifier selection, exclusions, or this eligibility gate. It includes groups without
    // numerator events and denominator events lacking group labels. For multiple group keys,
    // each complete label tuple is compared with the full matching population, not a parent group.
    // A zero group or population denominator is ineligible. This gate always uses >, independently
    // of condition. This is event contribution, not distinct-device adoption.
    //
    // For example, 20,000 of 1,000,000 opens gives 2% and passes a 0.01 threshold; 10,000 opens
    // gives exactly 1% and fails even if the failure rate and affected-device gates pass.
    optional double denominator_share_threshold = 2 [(validate.rules).double = {
      gte: 0
      lte: 1
    }];
  }

  // The value compared using condition, in the metric's units. Rates use fractions:
  // 0.0005 means 0.05%, not 0.05. Counts use event totals and histograms use the metric's unit.
  // The comparison uses individual data points or the entire window according to evaluation_mode.
  // Device and denominator-share gates, when configured, must also pass.
  double threshold = 1;

  // The strict comparison applied to threshold: ABOVE uses > and BELOW uses <.
  // Equality never breaches. This does not change the >= device gate or > denominator-share gate.
  .bitdrift.public.unary.alerts.v1.ThresholdCondition condition = 2 [(validate.rules).enum = {defined_only: true}];

  // The interval considered at each evaluation. Supported durations are 5 minutes, 10 minutes,
  // 1 hour, and 24 hours. Alerts are evaluated every 5 minutes, allowing the configured ingestion
  // delay before choosing the data cutoff.
  // DATA_POINTS searches this lookback for a qualifying run, rather than aggregating the whole
  // interval. WINDOW_ROLLUP computes one statistic over the trailing interval ending at the latest
  // completed source bucket. A one-hour aggregation_window instead uses completed clock hours;
  // it is not a way to request a rolling-hour statistic.
  .google.protobuf.Duration window = 3 [(validate.rules).duration.gt = {}];

  // The number of consecutive data points that must meet the threshold condition for the alert to
  // trigger. Data points use aggregation_window when set, or the default aggregation window for
  // window otherwise. This cannot exceed the number of complete aggregation windows within
  // window. If unset, defaults to 1. In DATA_POINTS, the qualifying run may occur anywhere in
  // the lookback and every point must pass the device and share gates. In WINDOW_ROLLUP this
  // must be omitted or 1; larger values are rejected rather than ignored.
  optional uint32 consecutive_data_points = 4;

  // Configuration for any histogram values within the aggregate ID. This is required if the
  // aggregate ID refers to a histogram so that one or more percentiles can be used as part of the
  // alert condition. In WINDOW_ROLLUP, the percentile is computed across the entire interval's
  // samples, not by averaging bucket percentiles.
  .bitdrift.public.unary.charts.v1.HistogramConfiguration histogram_configuration = 5;

  // Optional limit strategy to use for this alert. If this is omitted, a default value of limiting
  // by a top-K of 5 entries is used. Set all_groups: {} to evaluate every retained matching group,
  // subject to query-resource limits, or identifier_match to select specific groups.
  // Alert selection does not change chart display selection. Incomplete all-groups evaluations
  // fail explicitly and do not trigger or resolve an alert.
  // With WINDOW_ROLLUP or rate_options, synthetic top-K "other" series are not eligible to
  // trigger: they are not a real group and do not provide merged distinct-device statistics.
  // Actual user label values such as "other" are not synthetic and remain eligible.
  .bitdrift.public.unary.charts.v1.LimitStrategy limit_strategy = 6;

  // If specified, the alert will only trigger if at least this many unique devices are present in
  // each consecutive data point that breaches the threshold condition in DATA_POINTS mode,
  // or across the entire interval in WINDOW_ROLLUP mode. Equality passes (>=).
  // Counts are per group. Rates use denominator devices by default; rate_options can select
  // numerator devices instead. Whole-window devices are deduplicated across buckets: ten devices
  // reporting repeatedly still count as ten, not the sum of each bucket's distinct counts.
  // Counts use the platform's distinct-count aggregation and may be approximate.
  optional uint32 unique_device_threshold = 7;

  // The duration of each aggregated data point used to evaluate the alert. If unset, 5 minute,
  // 10 minute, and 1 hour evaluation windows use 1 minute data points, and 24 hour evaluation
  // windows use 15 minute data points. When set, this must be a positive, whole-number multiple
  // of the default aggregation window and no longer than window. Alerts evaluate only complete
  // aggregation windows ending at the most recent aggregation boundary.
  // Applies only to DATA_POINTS; rejected in WINDOW_ROLLUP. For example, window: "3600s" and
  // aggregation_window: "3600s" at 12:35 compare the completed [11:00, 12:00) clock-hour bucket.
  optional .google.protobuf.Duration aggregation_window = 8 [(validate.rules).duration.gt = {}];

  // Optional rate-specific device-source and denominator-contribution gates.
  // See RateOptions for population definitions, defaults, supported metric types, and examples.
  .bitdrift.public.unary.alerts.v1.BasicAlertConfig.RateOptions rate_options = 9;

  // Selects point-run or whole-window evaluation. Defaults to DATA_POINTS.
  // WINDOW_ROLLUP is an explicit opt-in and does not reinterpret existing alert configurations.
  // See EvaluationMode for reductions, timing, and incompatible point settings.
  .bitdrift.public.unary.alerts.v1.BasicAlertConfig.EvaluationMode evaluation_mode = 10 [(validate.rules).enum = {defined_only: true}];
}

// SLO alerts can only be defined on rate time series. The config will be failed otherwise. The
// rate must represent either successful or failed results divided by total results, as selected by
// rate_type. Ultimately the windows and burn rates are what drives alerting, but the SLO duration
// is still required so that error budget consumption can be calculated. Additionally, we can use
// the SLO duration to show SLO adherence over the trailing window if we like.
message SloAlertConfig {
  // Identifies whether the rate time series represents successful or failed results.
  enum RateType {
    // The rate is successful results divided by total results. This is the default.
    SUCCESS_RATE = 0;
    // The rate is failed results divided by total results.
    FAILURE_RATE = 1;
  }

  // SLO alerts use MWMBR (Multi-Window/Multi-Burn Rate). Each alert evaluation looks at every
  // WindowAndBurnRate and alerts if any of them alert. For an individual WindowAndBurnRate to alert
  // both the short window AND long window must breach based on the SLO target and burn rate.
  message WindowAndBurnRate {
    // Overrides the default notification settings for this burn-rate window.
    message OverrideNotifications {
      // Notification targets for the alert when this OverrideNotifications is used.
      repeated .bitdrift.public.unary.alerts.v1.RateLimitedNotificationConfig notifications = 1 [(validate.rules).repeated = {max_items: 100}];

      // Custom notification text to use when this OverrideNotifications is used. If not set,
      // the CommonAlertConfig.custom_notification_text will be used.
      optional string custom_notification_text = 2 [(validate.rules).string = {max_len: 2048}];
    }

    // Short evaluation window for this burn-rate policy.
    .google.protobuf.Duration short_window = 1 [(validate.rules).duration.gt = {}];

    // Long evaluation window for this burn-rate policy.
    .google.protobuf.Duration long_window = 2 [(validate.rules).duration.gt = {}];

    // Burn rate threshold that causes this policy to trigger.
    double burn_rate = 3;

    // Notification targets for the alert when this WindowAndBurnRate triggers. If unset, the
    // CommonAlertConfig.notifications will be used.
    .bitdrift.public.unary.alerts.v1.SloAlertConfig.WindowAndBurnRate.OverrideNotifications notifications = 4;
  }

  // Currently only supports 7 days and 30 days.
  .google.protobuf.Duration slo_duration = 1 [(validate.rules).duration.gt = {}];

  // A percentage expressed as a number between 0 and 1. For SUCCESS_RATE, this is the desired
  // success rate, such as 0.99 for 99%. For FAILURE_RATE, this is the maximum failure rate, such
  // as 0.01 for 1%.
  double slo_target = 2;

  // Optional limit strategy to use for this alert. If this is omitted, a default value of limiting
  // by a top k of 5 entries is used. Ultimately this will allow alerting on specific dimensions
  // for a group by aggregate ID if desired.
  .bitdrift.public.unary.charts.v1.LimitStrategy limit_strategy = 3;

  // The list of window and burn rates to use for the SLO alert. Each WindowAndBurnRate defines a
  // short and long window, as well as a burn rate. The alert will trigger if any of the
  // WindowAndBurnRates breach the SLO target based on the burn rate.
  repeated .bitdrift.public.unary.alerts.v1.SloAlertConfig.WindowAndBurnRate window_and_burn_rates = 4 [(validate.rules).repeated = {
    min_items: 1
    max_items: 10
  }];

  // Identifies how to interpret the rate time series and slo_target. Defaults to SUCCESS_RATE.
  .bitdrift.public.unary.alerts.v1.SloAlertConfig.RateType rate_type = 5 [(validate.rules).enum = {defined_only: true}];
}

// Rate of change alerts are used to look at significant changes over a period of time. They work
// for counter, rate, and histogram chart types.
message RateOfChangeAlertConfig {
  enum ChangeDirection {
    INCREASE = 0;
    DECREASE = 1;
  }

  oneof window_type {
    option (validate.required) = true;
    // This comparison type defines a window. [now - window, now] is compared to
    // [now - 2 * window, now - window].
    .google.protobuf.Duration window = 1 [(validate.rules).duration.gt = {}];
  }

  oneof comparison_type {
    option (validate.required) = true;
    // This compares an absolute amount of change when the data is aggregated across each of the
    // comparison windows.
    double absolute_change = 2;

    // This compares a percentage of change when the data is aggregated across each of the
    // comparison windows.
    double percentage_change = 3;
  }

  // The direction of change to check for.
  .bitdrift.public.unary.alerts.v1.RateOfChangeAlertConfig.ChangeDirection change_direction = 4 [(validate.rules).enum = {defined_only: true}];

  // Configuration for any histogram values within the aggregate ID. This is required if the
  // aggregate ID refers to a histogram so that one or more percentiles can be used as part of the
  // alert condition.
  .bitdrift.public.unary.charts.v1.HistogramConfiguration histogram_configuration = 5;

  // Optional limit strategy to use for this alert. If this is omitted, a default value of limiting
  // by a top k of 5 entries is used. Ultimately this will allow alerting on specific dimensions
  // for a group by aggregate ID if desired.
  .bitdrift.public.unary.charts.v1.LimitStrategy limit_strategy = 6;
}

// Defines caller-visible alert metadata shared by all alert types.
message CommonAlertConfig {
  // Short name for the alert.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];

  // Long form description for the alert.
  string description = 2 [(validate.rules).string = {max_len: 2048}];

  // Notification targets for the alert.
  repeated .bitdrift.public.unary.alerts.v1.RateLimitedNotificationConfig notifications = 3 [(validate.rules).repeated = {max_items: 100}];

  // If not empty, this text will be appended to the notification text for the alert when the
  // notification is sent.
  string custom_notification_text = 4 [(validate.rules).string = {max_len: 2048}];

  // Optional labels to attach to the alert. For notification channels that support structured data
  // (e.g. PagerDuty and SNS), these labels can be used to provide additional context for the alert.
  map<string, string> labels = 5 [(validate.rules).map.max_pairs = 20];
}

// Defines a workflow alert together with its shared metadata and alert type.
message AlertConfig {
  // Shared metadata and notification settings for the alert.
  .bitdrift.public.unary.alerts.v1.CommonAlertConfig common_config = 1 [(validate.rules).message.required = true];

  oneof alert_type {
    option (validate.required) = true;
    // Configuration for a basic alert.
    .bitdrift.public.unary.alerts.v1.BasicAlertConfig basic_alert = 5;

    // Configuration for an SLO alert.
    .bitdrift.public.unary.alerts.v1.SloAlertConfig slo_alert = 6;
  }
}

