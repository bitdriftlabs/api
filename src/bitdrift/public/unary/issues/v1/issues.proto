    min_len: 1
    max_len: 100
  }];
}

// Returns a page of issue groups.
message ListIssueGroupsResponse {
  // The issue groups.
  repeated .bitdrift.public.unary.issues.v1.IssueGroup issue_groups = 1;

  // The total number of issue groups that match the request across all pages.
