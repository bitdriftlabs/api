// Defines advanced filtering for issue groups.
//
// Each condition specifies a filter key, an operator, and a right-hand-side
// value. Depending on the selected field and operator, the right-hand side can
// represent a string, a semantic version, or another documented field-specific
// value.
//
// Conditions within each OrCondition are ORed together, and the list of
// OrConditions is ANDed together. For example:
// [condition1 OR condition2] AND [condition3] AND [condition4]
//
// AdvancedFilter {
//  andConditions:
//   [
//     OrCondition{
//       orConditions: [
//         Condition{lhsTyped: LHS_TYPED_APP_ID, operator: EQUAL, rhs: "com.example.app"},
//         Condition{lhsTyped: LHS_TYPED_APP_ID, operator: EQUAL, rhs: "com.example.app2"}
//       ]
//     },
//     OrCondition{orConditions: [Condition{lhsTyped: LHS_TYPED_PLATFORM, operator: EQUAL, rhs: "ANDROID"}]}
//   ]
// }
message AdvancedFilter {
  // A single condition that compares a filter key with a value.
  message Condition {
    // The filter keys that a condition can match against.
    enum LhsTyped {
      // No filter key is specified.
      LHS_TYPED_UNSPECIFIED = 0;
      // App ID associated with the issue.
      LHS_TYPED_APP_ID = 1;
      // Platform on which the issue occurred.
      LHS_TYPED_PLATFORM = 2;
      // App version associated with the issue. This works well with version comparison operators.
      LHS_TYPED_APP_VERSION = 3;
      // Operating system version associated with the issue.
      LHS_TYPED_OS_VERSION = 4;
      // Device model associated with the issue.
      LHS_TYPED_MODEL = 5;
      // Primary issue reason, such as an exception class or signal name.
      LHS_TYPED_REASON = 6;
      // Additional issue context, such as a file name or function name.
      LHS_TYPED_CONTEXT = 7;
      // High-level issue report type, such as Crash, ANR, or Exception.
      LHS_TYPED_REPORT_TYPE = 8;
      // iOS build ID associated with the issue. This corresponds to CFBundleVersion.
      LHS_TYPED_BUILD_ID = 9;
      // Android versionCode associated with the issue.
      LHS_TYPED_VERSION_CODE = 10;
      // Memory pressure level at the time of the issue.
      LHS_TYPED_MEMORY_PRESSURE_LEVEL = 11;
      // A function in the reported stack trace. The only supported operators are SEARCH and
      // NOT_SEARCH.
      LHS_TYPED_FUNCTION = 12;
      // A file in the reported stack trace. The only supported operators are SEARCH and
      // NOT_SEARCH.
      LHS_TYPED_FILE = 13;
      // A module in the reported stack trace. The only supported operators are SEARCH and
      // NOT_SEARCH.
      LHS_TYPED_MODULE = 14;
      // The model manufacturer associated with the issue, e.g. "Google" for models like the Pixel.
      LHS_TYPED_MANUFACTURER = 15;
      // The error details associated with a report.
      // For exceptions, this is the exception message; for other crashes (for example, ANRs), this may be a larger diagnostic report.
      // The only supported operators are SEARCH and NOT_SEARCH.
      LHS_TYPED_DETAILS = 16;
      // The ID of the device that sent the report.
      // The only supported operators are EQUAL and IN.
      LHS_TYPED_DEVICE_ID = 17;
      // An entity hash, as returned by the entity APIs. Matches reports from the devices the entity
      // used during the query time range: a device counts when one of its connections for the
      // entity overlaps the range. A connection is recorded when it closes, so a device whose only
      // such connection is still open does not match yet. The devices are looked up each time the
      // query runs rather than when the filter is saved, so a saved view follows the entity to
      // devices it starts using later. Entity-device associations are kept for 6 months, so a
      // range older than that matches no reports.
      // The only supported operators are EQUAL and IN.
      LHS_TYPED_ENTITY_HASH = 18;
      // The linked Android crash-profile category: "anr" or "oom", inferred from the report kind.
      // Matches retained completed links, including failed conversions, not current download
      // availability. Pending processing counts as absent. EQUAL/IN select categories and
      // NOT_EQUAL/NOT_IN exclude them, including reports with no profile. An empty RHS with
      // NOT_EQUAL checks presence; EQUAL checks absence. WILDCARD "*" checks presence and
      // NOT_WILDCARD "*" or "?*" checks absence; other patterns are not supported.
      // In group searches, matches groups containing a matching occurrence. A group can contain
      // both profiled and unprofiled occurrences, so it can match both presence and absence.
      LHS_TYPED_PROFILE_TYPE = 19;
    }

    // The filter key to match against.
    .bitdrift.public.unary.issues.v1.AdvancedFilter.Condition.LhsTyped lhs_typed = 4 [(validate.rules).enum = {defined_only: true}];

    // LHS_TYPED_FUNCTION, LHS_TYPED_FILE, LHS_TYPED_MODULE, and LHS_TYPED_DETAILS support only
    // SEARCH and NOT_SEARCH. LHS_TYPED_DEVICE_ID and LHS_TYPED_ENTITY_HASH support only EQUAL and
    // IN. LHS_TYPED_PROFILE_TYPE supports exact category matching and presence/absence as
    // described on that key. All other keys support every operator except SEARCH and NOT_SEARCH.
    .bitdrift.public.unary.common.v1.Operator operator = 2 [(validate.rules).enum = {defined_only: true}];

    // The value to compare with the filter key.
    string rhs = 3 [(validate.rules).string = {max_len: 255}];
  }

  // A group of conditions that matches when any of its conditions matches.
  message OrCondition {
    // The conditions that are ORed together.
    repeated .bitdrift.public.unary.issues.v1.AdvancedFilter.Condition or_conditions = 1 [(validate.rules).repeated = {max_items: 100}];
  }

  // The condition groups that are ANDed together.
  repeated .bitdrift.public.unary.issues.v1.AdvancedFilter.OrCondition and_conditions = 1 [(validate.rules).repeated = {max_items: 100}];
}

// Selects issues by a feature flag that was active when they occurred.
message FeatureFlagFilter {
  // The name of the feature flag to filter by.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];

  // The variant of the feature flag to filter by. If not specified, all variants are included.
  optional string variant = 2 [(validate.rules).string = {max_len: 100}];

  // Only include issues that are exclusively associated with this feature flag (and variant, if specified). This implies that
  // this feature flag was always active when the issue occurred.
  bool exclusive = 3;
}

// Limits what issues are being queried for an endpoint. For issue group queries, this limits which issues are considered when listing issue groups.
message IssueQuery {
  // The time range to query issues for. This is required when querying for issues, but optional when saving a view.
  .bitdrift.public.unary.common.v1.TimeRange time_range = 7;

  // The platforms to filter by.
  repeated .bitdrift.public.shared.platform.v1.Platform platforms = 3 [(validate.rules).repeated = {max_items: 100}];

  // The advanced filters to apply to the issue query.
  .bitdrift.public.unary.issues.v1.AdvancedFilter advanced_filters = 4;

  // The group ID(s) to filter by. Only issues belonging to these group IDs will be returned.
  repeated string grouping_key = 5 [(validate.rules).repeated = {max_items: 100}];

  // The feature flag filters to apply to the issue query. Only issues that had the specified feature flags active will be returned.
  repeated .bitdrift.public.unary.issues.v1.FeatureFlagFilter feature_flag_filters = 6 [(validate.rules).repeated = {max_items: 100}];
}

// The triage status of an issue group.
enum IssueGroupStatus {
  // Newly created issue group that has not yet been triaged.
  NEW = 0;
  // Issue group currently under investigation.
  IN_PROGRESS = 3;
  // Issue group marked fixed for a specific app version.
  FIXED = 4;
  // Issue group that was marked fixed and later recurred on a newer app version.
  REOPENED = 5;
  // Issue group hidden from default views without marking it fixed.
  IGNORED = 6;
  // Issue group temporarily hidden until the snooze expires.
  SNOOZED = 7;
}

// Limits what issue groups are being queried for an endpoint.
message IssueGroupQuery {
  // The assignee(s) of an issue group to filter by.
  repeated .bitdrift.public.unary.common.v1.Owner assignee = 1 [(validate.rules).repeated = {max_items: 100}];

  // The status(es) of issue groups to filter by.
  repeated .bitdrift.public.unary.issues.v1.IssueGroupStatus issue_group_status = 2 [(validate.rules).repeated = {
    max_items: 100
    items: {
      enum: {defined_only: true}
    }
  }];
}

// A time-series data point that counts issue occurrences in an aggregation interval.
message Event {
  // The start of the aggregation interval.
  .google.protobuf.Timestamp period_start = 1 [(validate.rules).message = {required: true}];

  // The number of issue occurrences in the aggregation interval.
  uint64 count = 2;
}

// A group of related issues that share a grouping key.
message IssueGroup {
  // Descriptive information that identifies the issue group.
  message Metadata {
    // The issue group type, such as Crash, ANR, or Exception.
    string type = 1;

    // The issue group reason, such as OutOfMemoryError or
    // NullPointerException.
    string reason = 2;

    // Additional issue group context, such as a file name or function name.
    // This value is used as part of the grouping key.
    optional string context = 3;

    // Detailed issue data, such as a stack trace or error message. This value
    // is not used as part of the grouping key. It comes from one issue in the
    // group and may not represent the entire group.
    optional string details = 4;

    // The platform and app ID associated with the issue group.
    .bitdrift.public.shared.platform.v1.Platform platform = 5 [(validate.rules).message = {required: true}];
  }

  // Occurrence statistics for the issue group.
  message Stats {
    // The first time the issue group was seen within the time range.
    .google.protobuf.Timestamp first_seen = 1 [(validate.rules).message = {required: true}];

    // The last time the issue group was seen within the time range.
    .google.protobuf.Timestamp last_seen = 2 [(validate.rules).message = {required: true}];

    // The first time any report was seen for this issue group.
    .google.protobuf.Timestamp first_report_seen = 6 [(validate.rules).message = {required: true}];

    // The number of unique users that have experienced this issue.
    uint64 user_count = 3;

    // Issue occurrence counts for each aggregation interval within the time range.
    repeated .bitdrift.public.unary.issues.v1.Event events = 4;

    // The number of unique sessions in which this issue was reported.
    uint64 session_count = 5;
  }

  // The unique identifier for the issue group.
  string id = 1;

  // The metadata for the issue group.
  .bitdrift.public.unary.issues.v1.IssueGroup.Metadata metadata = 2;

  // The platforms on which the issue group occurred. This usually contains a single platform.
  repeated .bitdrift.public.shared.platform.v1.Platform platform = 3;

  // The stats for the issue group.
  .bitdrift.public.unary.issues.v1.IssueGroup.Stats stats = 4;

  // The assignees of the issue group.
  repeated .bitdrift.public.unary.common.v1.Owner assignees = 5;

  // The status of the issue group.
  .bitdrift.public.unary.issues.v1.IssueGroupStatus status = 6;

  // The latest app version or Android version code when the issue group was marked fixed.
  oneof resolution_version {
    // The latest app version when the issue group was marked fixed.
    string version = 8;

    // The latest Android version code when the issue group was marked fixed.
    int64 version_code = 9;
  }
}

