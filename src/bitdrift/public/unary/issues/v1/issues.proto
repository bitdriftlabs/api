}

// Requests a single issue.
message GetIssueRequest {
  // The unique identifier for the issue.
  string id = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];

  // The unique identifier for the issue group this issue belongs to.
  string issue_group_id = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];
}

// A single reported issue, such as a crash or an error, with details about the app and device.
message Issue {
  // The reason for the issue. This should match the reason in the issue group.
  string reason = 1 [(validate.rules).string = {min_len: 1}];

  // The grouping context for the crash. This should match the grouping context in the issue group.
  string context = 2 [(validate.rules).string = {min_len: 1}];

  // The extra details for the issue. This will not necessarily match the details in the issue group.
  string details = 3 [(validate.rules).string = {min_len: 1}];

  // When the issue occurred.
  .google.protobuf.Timestamp time = 4 [(validate.rules).message = {required: true}];

  // Information about the device that the issue occurred on.
  .bitdrift.public.shared.platform.v1.Platform platform = 5 [(validate.rules).message = {required: true}];

  // The app ID of the app that reported the issue.
  string app_id = 6;

  // The app version that reported the issue.
  string app_version = 7;

  // The build identifier of the app: the bundle version on Apple platforms or the version code on
  // Android.
  string build_id = 8;

  // The device model on which the issue occurred.
  string model = 9;

  // Whether the app was in the foreground when the issue occurred.
  bool foreground = 15;

  // The network type of the device when the issue occurred.
  string network_type = 16 [(validate.rules).string = {min_len: 1}];

  // The radio type of the device when the issue occurred.
  string radio_type = 17 [(validate.rules).string = {min_len: 1}];

  // The device locale when the issue occurred.
  string locale = 18 [(validate.rules).string = {min_len: 1}];

  // The type of report that captured the issue.
  string report_type = 19 [(validate.rules).string = {min_len: 1}];

  // The processed report for the issue, including its stack traces.
  .bitdrift.public.unary.issues.v1.Report report = 12 [(validate.rules).message = {required: true}];

  // The unique identifier for the issue.
  string id = 13 [(validate.rules).string = {min_len: 1}];

  // The unique ID of the session that this issue occurred within.
  optional string session_id = 14 [(validate.rules).string = {min_len: 1}];

  // The status of the session associated with this issue.
  .bitdrift.public.unary.common.v1.SessionStatusInfo session_status_info = 20;
}

// Returns the requested issue and its availability.
message GetIssueResponse {
  // The requested issue, when it is available.
  .bitdrift.public.unary.issues.v1.Issue issue = 12;

  // The availability of the requested issue.
  enum Status {
    // The issue was found and its details are available.
    FOUND = 0;
    // No reference to the issue was found.
    NOT_FOUND = 1;
    // The issue has not finished processing. An issue can stay in this state if processing stalls.
    PENDING = 2;
    // The issue was processed, but an error during processing prevents its stack trace from being
    // available. The failure reason is not returned.
    FAILED = 3;
  }

  // The status of the issue. If set to FOUND, the issue was found and the details are available.
  .bitdrift.public.unary.issues.v1.GetIssueResponse.Status status = 13 [(validate.rules).enum = {defined_only: true}];

  // Completed Android crash profiles for this occurrence. An empty COMPLETE section does not
  // distinguish no profile from processing that has not completed. Profile metadata errors never
  // remove the issue itself. At most 32 profiles are returned; PARTIAL or UNAVAILABLE must not be
  // presented as an empty successful result. This section is revalidated on every request.
  .bitdrift.public.unary.issues.v1.IssueProfiles profiles = 14;
}

message IssueProfiles {
  enum Status {
    COMPLETE = 0;
    PARTIAL = 1;
    UNAVAILABLE = 2;
  }

  .bitdrift.public.unary.issues.v1.IssueProfiles.Status status = 1;

  repeated .bitdrift.public.unary.issues.v1.IssueProfile profiles = 2;

  // Additional completed links exceeded the response's 32-profile budget.
  bool has_more = 3;
}

message IssueProfile {
  // Profile UUID. Other occurrences linked to a shared profile are never returned.
  // With the same organization authorization and `ISSUE_READ` permission, inspect
  // `GET /v1/crash-profiles/{id}/status` for raw/processed object availability, or download
  // `GET /v1/crash-profiles/{id}?variant=raw` or
  // `GET /v1/crash-profiles/{id}?variant=processed`.
  // These artifact reads do not depend on the linked occurrence still being present or in
  // the same group. Completion status and timestamps are provided by this descriptor.
  // The download variant is required. Raw is an original Perfetto trace; processed is a TAR
  // containing `trace.perfetto`, `symbols.pb` and `deobfuscation.pb`. Processed never falls back to raw.
  string id = 1;

  .google.protobuf.Timestamp captured_at = 2;

  .google.protobuf.Timestamp processed_at = 3;

  enum ProcessingStatus {
    SUCCEEDED = 0;
    FAILED = 1;
  }

  .bitdrift.public.unary.issues.v1.IssueProfile.ProcessingStatus processing_status = 4;

  enum Availability {
    UNAVAILABLE = 0;
    AVAILABLE = 1;
    EXPIRED = 2;
    // An expected processed object is missing, corrupt, or could not be checked. Retry rather
    // than treating this as ordinary absence. Downloads of a promised object can also fail.
    ERROR = 3;
  }

  .bitdrift.public.unary.issues.v1.IssueProfile.Availability raw = 5;

  .bitdrift.public.unary.issues.v1.IssueProfile.Availability processed = 6;
}

