  }

  // A sort criterion for issues.
  message Sort {
    // The issue attributes that results can be ordered by.
    enum SortKey {
      // No sort key is specified. A sort criterion with this key is rejected.
      SORT_KEY_UNSPECIFIED = 0;
      // Orders results by the time each issue occurred.
      OCCURRED_AT = 1;
    }

    // Selects which caller-visible issue attribute to order by.
    .bitdrift.public.unary.issues.v1.ListIssuesV2Request.Sort.SortKey key = 1 [(validate.rules).enum = {defined_only: true}];

    // Selects whether results are returned in ascending or descending order.
    .bitdrift.public.unary.common.v1.SortDirection direction = 2 [(validate.rules).enum = {defined_only: true}];
  }

  // Selection criteria for the issues to list.
  message Query {
    // Limits results to issues that occurred within the selected time range.
