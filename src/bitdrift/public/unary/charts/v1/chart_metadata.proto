syntax = "proto3";

package bitdrift.public.unary.charts.v1;

import "bitdrift/public/shared/workflows/v1/time_series.proto";
import "bitdrift/public/unary/charts/v1/chart_id.proto";
import "validate/validate.proto";

message ChartMetadata {
  message FlushChartMetadata {}

  message SankeyChartMetadata {}

  message MetricChartMetadata {
    message TimeSeriesMetadata {
      enum TopKAlgorithm {
        TOP_K_ALGORITHM_UNSPECIFIED = 0;
        TOP_K_ALGORITHM_AVERAGED = 1;
        TOP_K_ALGORITHM_2TIERED = 2;
        TOP_K_ALGORITHM_3TIERED = 3;
      }

      message Axis {
        // The description of the axis to display.
        string description = 1 [(validate.rules).string = {max_len: 255}];

        enum Unit {
          UNSPECIFIED = 0;
          PERCENTAGE = 1;
          MILLISECONDS = 2;
          TIMESTAMP = 3;
          BYTES = 4;
          COUNT = 5;
          KILOBYTES = 6;
          MEGABYTES = 8;
          SECONDS = 9;
          MINUTES = 10;
          HOURS = 11;
          DAYS = 12;
          GIGABYTES = 13;
        }

        // The unit of the axis.
        .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.Axis.Unit unit = 2 [(validate.rules).enum = {defined_only: true}];
      }

      // Configuration for exporting data to a connector.
      message ConnectorExportConfig {
        message OtlpConnectorExportConfig {
          // Selects exactly one histogram representation. Use a different metric name when
          // changing representation to avoid incompatible metric types at the receiver.
          message HistogramConfiguration {
            message Summary {
              // Unique quantiles emitted independently of chart display percentiles.
              repeated double percentiles = 1 [(validate.rules).repeated = {
                min_items: 1
                max_items: 20
                items: {
                  double: {
                    gte: 0
                    lte: 1
                  }
                }
              }];
            }

            // Exponential buckets approximate the source sketch: original sums and extrema are
            // not retained. Sums are estimated for nonnegative populations and omitted otherwise.
            // Conversion starts at scale 5 and downscales to at most 256 dense buckets per sign,
            // including across cumulative intervals. Wide ranges reduce resolution; collapsed
            // sketch bins cannot be recovered.
            message Exponential {
              enum Temporality {
                TEMPORALITY_UNSPECIFIED = 0;
                CUMULATIVE = 1;
                DELTA = 2;
              }

              // Unspecified defaults to `CUMULATIVE`. `DELTA` exports independent one-minute
              // populations and requires a compatible receiver. `CUMULATIVE` accumulates those
              // populations in memory; restart, metric-setting changes, or worker reassignment
              // starts a new accumulation with a new start timestamp. Credential rotation
              // preserves accumulation. Only processed minutes contribute; missing populations
              // are not inferred. Use a different metric name when changing temporality.
              .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.OtlpConnectorExportConfig.HistogramConfiguration.Exponential.Temporality temporality = 1 [(validate.rules).enum = {defined_only: true}];
            }

            oneof histogram_type {
              option (validate.required) = true;
              // Emits the selected quantiles as an OTLP summary.
              .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.OtlpConnectorExportConfig.HistogramConfiguration.Summary summary = 1;

              // Emits an OTLP exponential histogram with configurable temporality.
              .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.OtlpConnectorExportConfig.HistogramConfiguration.Exponential exponential = 2;
            }
          }

          // The metric name emitted to the configured OTLP endpoint.
          string metric_name = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 255
          }];

          // Fixed attributes included with each point. These override matching dynamic attributes.
          map<string, string> fixed_attributes = 2 [(validate.rules).map = {
            max_pairs: 10
            keys: {
              string: {
                min_len: 1
                max_len: 128
              }
            }
            values: {
              string: {max_len: 255}
            }
          }];

          // Delay before exporting a completed minute, in whole-minute increments. Defaults to 180.
          optional uint32 export_delay_seconds = 3 [(validate.rules).uint32 = {
            gte: 60
            lte: 86400
          }];

          // Required for histogram-backed exports; counters must leave this unset.
          .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.OtlpConnectorExportConfig.HistogramConfiguration histogram_configuration = 6;
        }

        message CloudwatchConnectorExportConfig {
          // The CloudWatch namespace to which data will be exported. This will be appended to
          // 'bitdrift/'.
          string namespace = 1 [(validate.rules).string = {
            min_len: 1
            max_len: 255
          }];

          // The CloudWatch metric name to emit within the configured namespace.
          string metric_name = 2 [(validate.rules).string = {
            min_len: 1
            max_len: 255
          }];

          // A set of fixed dimensions to include with every metric emitted to CloudWatch. These
          // dimensions will be added in addition to any dimensions specified by the time series
          // query.
          map<string, string> fixed_dimensions = 3 [(validate.rules).map.max_pairs = 10];
        }

        // The name of the connector to which data will be exported. The connector should have
        // already been added via the AdminService's UpsertConnector method. The connector type
        // must match the type expected by the time series export configuration.
        string connector_name = 1 [(validate.rules).string = {
          min_len: 1
          max_len: 255
        }];

        oneof connector_type {
          option (validate.required) = true;
          // Configuration specific to CloudWatch connectors. CloudWatch export is valid only for
          // counter-backed time series. The configuration fails if the time series uses histogram
          // data. For metrics with a numerator and denominator, the export configuration emits two
          // CloudWatch metrics: one for the numerator and one for the denominator. The supplied
          // metric name is appended with "/numerator" and "/denominator" for the respective
          // metrics.
          .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.CloudwatchConnectorExportConfig cloudwatch_connector_export_config = 2;

          // OTLP export for counters, summaries, and exponential histograms. Rate and average metrics export
          // separate counters with /numerator and /denominator appended to the supplied name.
          .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig.OtlpConnectorExportConfig otlp_connector_export_config = 3;
        }
      }

      // The Y axis of the time series. This is used to format the Y axis of the chart as well as
      // the hover tooltip.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.Axis y_axis = 1;

      // The title of the time series. This is used to display the time series in the chart.
      string title = 2 [(validate.rules).string = {max_len: 255}];

      // Determines how the TopK is sorted when performing TopK queries. Defaults to Maximum.
      .bitdrift.public.unary.charts.v1.SortOrder sort_order = 3 [(validate.rules).enum = {defined_only: true}];

      // Optional limit strategy to persist for this time series (top K count, dimension
      // selection, sort order).
      optional .bitdrift.public.unary.charts.v1.LimitStrategy limit_strategy = 4;

      // The top K algorithm to use for this time series to determine which K time series are selected for group by time series.
      optional .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.TopKAlgorithm top_k_algorithm = 5 [(validate.rules).enum = {defined_only: true}];

      // Configuration for exporting data to a connector. A team-owned connector can be used only
      // by a member of the team on a workflow owned by that team. Changes to exports using
      // organization-owned connectors require CONNECTOR_EXPORT_ADMIN when that policy is enabled.
      repeated .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata.ConnectorExportConfig connector_export_config = 6 [(validate.rules).repeated.max_items = 10];

      // The ID that identifies this configured metric time series in resolved chart responses.
      // This is generated by the server and matches TimeSeries.id, Table.time_series_id, and
      // HistogramBarChartResponse.PerTimeSeries.time_series_id for the same configured series.
      // Do not populate this field when creating or updating chart metadata.
      string time_series_id = 7 [(validate.rules).string = {max_len: 255}];
    }

    message TimeSeriesDisplayMode {}

    message TableDisplayMode {}

    message HistogramBarChartDisplayMode {}

    // Compares multiple histogram distributions on shared axes.
    message HistogramDistributionDisplayMode {}

    // Displays grouped time-series values as stacked bars.
    message StackedTimeSeriesBarChartDisplayMode {}

    // Displays aggregate metric values as a set of stat tiles. Grouped values
    // become individual tiles, while an ungrouped value occupies the full chart.
    message HeatMapDisplayMode {
      message CounterCalculation {
        .bitdrift.public.shared.workflows.v1.Counter.CounterAggregationType aggregation_type = 1 [(validate.rules).enum = {defined_only: true}];
      }

      // Counter metrics may either use equal tile sizes or use the unique-device
      // count that is already collected for the metric. Rate and average-count
      // metrics always use their denominator for sizing.
      enum CounterSizing {
        COUNTER_SIZING_EQUAL = 0;
        COUNTER_SIZING_UNIQUE_DEVICES = 1;
      }

      message ColorThresholds {
        // Four strictly monotonic values in the primary metric's native unit.
        repeated double values = 1 [(validate.rules).repeated = {
          min_items: 4
          max_items: 4
        }];
      }

      // Selects the aggregate displayed by a counter metric. Rate and
      // average-count metrics always display their full-range ratio instead.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HeatMapDisplayMode.CounterCalculation counter_calculation = 1;

      // Counter-backed tiles are equal-sized by default. Rate and average-count
      // tiles always use their denominator, regardless of this value.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HeatMapDisplayMode.CounterSizing counter_sizing = 2 [(validate.rules).enum = {defined_only: true}];

      // When absent, tiles use a neutral color.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HeatMapDisplayMode.ColorThresholds color_thresholds = 3;
    }

    // Displays a grouped metric as categorical slices.
    message PieChartDisplayMode {}

    // Displays a grouped metric as basic categorical bars.
    message BasicBarChartDisplayMode {}

    oneof display_mode {
      // Displays the chart as a time series visualization.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesDisplayMode time_series_display_mode = 1;

      // Displays the chart as a table.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TableDisplayMode table_display_mode = 2;

      // Displays histogram data as a bar chart.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HistogramBarChartDisplayMode histogram_bar_chart_display_mode = 3;

      // Displays metric values as aggregate stat tiles.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HeatMapDisplayMode heat_map_display_mode = 6;

      // Displays a grouped metric as a pie chart.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.PieChartDisplayMode pie_chart_display_mode = 8;

      // Displays a grouped metric as basic categorical bars.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.BasicBarChartDisplayMode basic_bar_chart_display_mode = 9;

      // Displays histogram distributions as overlapping lines on shared axes.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.HistogramDistributionDisplayMode histogram_distribution_display_mode = 10;

      // Displays grouped time-series values as stacked bars.
      .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.StackedTimeSeriesBarChartDisplayMode stacked_time_series_bar_chart_display_mode = 11;
    }

    // Metadata for each time series in the chart. The length of this list should match the number
    // of time series in the chart's query. If a time series does not have metadata, provide the
    // default object and defaults will be used. In resolved chart responses, each entry includes
    // its server-generated time_series_id.
    repeated .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata.TimeSeriesMetadata metadata = 4 [(validate.rules).repeated = {max_items: 100}];
  }

  message FunnelChartMetadata {
    message StepDetail {
      // The funnel step name. It is used to display the step in the funnel chart.
      string name = 1 [(validate.rules).string = {max_len: 255}];
    }

    // Extra details pertaining to each step of the funnel. The step details is associated via the
    // index of the array, e.g. the nth element in this array corresponds to the nth step in the
    // funnel. This allows modifying this data without knowing about the server generated IDs.
    repeated .bitdrift.public.unary.charts.v1.ChartMetadata.FunnelChartMetadata.StepDetail steps = 1 [(validate.rules).repeated = {max_items: 100}];
  }

  message Summary {
    // A description displayed alongside the chart as help text.
    string description = 1 [(validate.rules).string = {max_len: 500}];
  }

  // The title of the chart to be displayed.
  string title = 1 [(validate.rules).string = {max_len: 255}];

  // An optional piece of summary information to display alongside the chart.
  optional .bitdrift.public.unary.charts.v1.ChartMetadata.Summary summary = 2;

  // An optional message to display when there is no data available for the chart. If not set use
  // the default message.
  optional string no_data_message = 3 [(validate.rules).string = {max_len: 500}];

  oneof metadata_type {
    option (validate.required) = true;
    // Metadata for metric-based charts such as time series, tables, and histograms.
    .bitdrift.public.unary.charts.v1.ChartMetadata.MetricChartMetadata metric_chart_metadata = 4;

    // Metadata for funnel charts.
    .bitdrift.public.unary.charts.v1.ChartMetadata.FunnelChartMetadata funnel_chart_metadata = 5;

    // Metadata for session capture flush charts.
    .bitdrift.public.unary.charts.v1.ChartMetadata.FlushChartMetadata flush_chart_metadata = 6;

    // Metadata for sankey charts.
    .bitdrift.public.unary.charts.v1.ChartMetadata.SankeyChartMetadata sankey_chart_metadata = 7;
  }
}

message UpsertWorkflowChartMetadataRequest {
  // The workflow ID.
  string workflow_id = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];

  // The rule ID.
  string rule_id = 2 [(validate.rules).string = {
    min_len: 1
    max_len: 100
  }];

  // The metadata.
  .bitdrift.public.unary.charts.v1.ChartMetadata metadata = 3 [(validate.rules).message = {required: true}];
}

message UpsertWorkflowChartMetadataResponse {}
