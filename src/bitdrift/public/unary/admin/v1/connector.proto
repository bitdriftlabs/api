syntax = "proto3";

package bitdrift.public.unary.admin.v1;

import "validate/validate.proto";

message ConnectorConfig {
  message OtlpConnectorConfig {
    // The full HTTPS metrics endpoint, including its path, typically /v1/metrics.
    string endpoint = 1 [(validate.rules).string = {
      min_len: 1
      max_len: 2048
    }];

    // Static HTTP headers for authentication. Header values are redacted in connector responses.
    // A redacted value preserves the existing header only when the endpoint is unchanged.
    map<string, string> headers = 2 [(validate.rules).map = {
      max_pairs: 20
      keys: {
        string: {
          min_len: 1
          max_len: 128
        }
      }
      values: {
        string: {
          min_len: 1
          max_len: 4096
        }
      }
    }];
  }

  message CloudwatchConnectorConfig {
    // The AWS region for the CloudWatch connector.
    string region = 1 [(validate.rules).string = {
      min_len: 1
      max_len: 64
    }];

    // The role ARN for the CloudWatch connector. This role will be assumed by the connector
    // in order to put metrics into CloudWatch.
    //
    // The role MUST have the following permission policy:
    // ```json
    // {
    //   "Version": "2012-10-17",
    //   "Statement": [
    //     {
    //       "Sid": "AllowScopedMetricPush",
    //       "Effect": "Allow",
    //       "Action": "cloudwatch:PutMetricData",
    //       "Resource": "*",
    //       "Condition": {
    //         "StringLike": {
    //           "cloudwatch:namespace": "bitdrift/*"
    //         }
    //       }
    //     }
    //   ]
    // }
    // ```
    // The role MUST have the following trust policy. Replace `<bitdrift account ID>` with the
    // actual Bitdrift account ID provided by your sales or support contact:
    // ```json
    // {
    //   "Version": "2012-10-17",
    //   "Statement": [
    //     {
    //       "Effect": "Allow",
    //       "Principal": {
    //         "AWS": "arn:aws:iam::<bitdrift account ID>:root"
    //       },
    //       "Action": "sts:AssumeRole",
    //       "Condition": {
    //         "StringEquals": {
    //           "sts:ExternalId": "bitdrift"
    //         }
    //       }
    //     }
    //   ]
    // }
    // ```
    string role_arn = 2 [(validate.rules).string = {
      min_len: 1
      max_len: 255
    }];
  }

  // The name of the connector.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];

  oneof connector_type {
    option (validate.required) = true;
    // Configuration for an AWS CloudWatch connector.
    .bitdrift.public.unary.admin.v1.ConnectorConfig.CloudwatchConnectorConfig cloudwatch_connector_config = 2;

    // Configuration for an OTLP metrics connector using HTTP binary protobuf.
    .bitdrift.public.unary.admin.v1.ConnectorConfig.OtlpConnectorConfig otlp_connector_config = 3;
  }

  // The team that owns this connector. When creating a connector, omitting this field makes it
  // organization-owned. When updating a connector, omitting it preserves the current owner.
  // Set it to an empty string to transfer ownership to the organization; this requires
  // CONNECTOR_ADMIN permission.
  optional string team_id = 4 [(validate.rules).string = {max_len: 100}];
}

message UpsertConnectorRequest {
  // The connector to upsert.
  .bitdrift.public.unary.admin.v1.ConnectorConfig connector = 1 [(validate.rules).message = {required: true}];
}

message UpsertConnectorResponse {}

message GetConnectorsRequest {
  // When set, returns connectors that can be used by the authenticated user on this workflow.
  optional string workflow_id = 1 [(validate.rules).string = {max_len: 255}];
}

message GetConnectorsResponse {
  // The connectors available to the authenticated user for the requested scope.
  repeated .bitdrift.public.unary.admin.v1.ConnectorConfig connectors = 1;
}

message DeleteConnectorRequest {
  // The name of the connector to delete.
  string name = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 255
  }];
}

message DeleteConnectorResponse {}
