syntax = "proto3";

package bitdrift.public.unary.admin.v1;

import "bitdrift/public/unary/admin/v1/teams.proto";
import "bitdrift/public/unary/common/v1/common.proto";
import "validate/validate.proto";

enum AccessLevel {
  VIEW = 0;
  EDIT = 1;
  NONE = 2;
}

// Message used when receiving queries for access permission levels.
message AccessPermissionQuery {
  enum AccessLevel {
    VIEW = 0;
    EDIT = 1;
    OWNER = 2;
  }

  enum Operator {
    IS = 0;
    IS_NOT = 1;
  }

  // A single predicate: e.g. "access IS EDIT" or "access IS_NOT OWNER".
  message Condition {
    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.Operator operator = 1 [(validate.rules).enum = {defined_only: true}];

    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.AccessLevel level = 2 [(validate.rules).enum = {defined_only: true}];
  }

  // All conditions must be true (logical AND).
  message AllOf {
    repeated .bitdrift.public.unary.admin.v1.AccessPermissionQuery.Condition conditions = 1 [(validate.rules).repeated = {
      min_items: 1
      max_items: 20
    }];
  }

  // A filter that matches when at least one AllOf group is satisfied (logical OR of ANDs).
  // Example: (IS VIEW AND IS_NOT OWNER) OR (IS EDIT)
  message AccessFilter {
    repeated .bitdrift.public.unary.admin.v1.AccessPermissionQuery.AllOf any_of = 1 [(validate.rules).repeated = {
      min_items: 1
      max_items: 20
    }];
  }

  message Individual {
    string user_id = 1 [(validate.rules).string = {
      min_len: 1
      max_len: 100
    }];

    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.AccessFilter filter = 2;
  }

  message Team {
    string team_id = 1 [(validate.rules).string = {
      min_len: 1
      max_len: 100
    }];

    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.AccessFilter filter = 2;
  }

  oneof type {
    option (validate.required) = true;
    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.Individual individual = 1;

    .bitdrift.public.unary.admin.v1.AccessPermissionQuery.Team team = 2;
  }
}

// Used to represent the current access permission of an entity.
// This gives the full scope of which users/teams have what level of access,
// the level of access given to the entire org, and the ownership of the entity (team or user).
message AccessPermission {
  message Individual {
    // The user details
    .bitdrift.public.unary.common.v1.Owner details = 1;

    // The access level to set for the user.
    .bitdrift.public.unary.admin.v1.AccessLevel access = 2;
  }

  message Team {
    // The team details
    .bitdrift.public.unary.admin.v1.Team details = 1;

    // The access level to set for the team.
    .bitdrift.public.unary.admin.v1.AccessLevel access = 2;
  }

  message Org {
    // The access level to set for the entire organization.
    .bitdrift.public.unary.admin.v1.AccessLevel access = 1;
  }

  message Owner {
    oneof id {
      .bitdrift.public.unary.common.v1.Owner user = 1;

      .bitdrift.public.unary.admin.v1.Team team = 2;
    }
  }

  // A list of individual users to set access for.
  repeated .bitdrift.public.unary.admin.v1.AccessPermission.Individual individuals = 1;

  // A list of teams to set access for.
  repeated .bitdrift.public.unary.admin.v1.AccessPermission.Team teams = 2;

  // The access level to set for the entire organization.
  .bitdrift.public.unary.admin.v1.AccessPermission.Org org = 3;

  // Only one entity with the owner level access will exist. i.e. a user reassigning their
  // owner access to a team, will no longer have owner access _unless_ they belong to that team.
  .bitdrift.public.unary.admin.v1.AccessPermission.Owner owner = 4;
}

message SetAccessRequest {
  message SetAccessPermission {
    message Individual {
      // The ID of the user to set access for.
      string id = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 100
      }];

      // The access level to set for the user.
      .bitdrift.public.unary.admin.v1.AccessLevel access = 2 [(validate.rules).enum = {defined_only: true}];
    }

    message Team {
      // The ID of the team to set access for.
      string id = 1 [(validate.rules).string = {
        min_len: 1
        max_len: 100
      }];

      // The access level to set for the team.
      .bitdrift.public.unary.admin.v1.AccessLevel access = 2 [(validate.rules).enum = {defined_only: true}];
    }

    message Org {
      // The access level to set for the entire organization.
      .bitdrift.public.unary.admin.v1.AccessLevel access = 1 [(validate.rules).enum = {defined_only: true}];
    }

    message Owner {
      oneof id {
        option (validate.required) = true;
        string user_id = 1 [(validate.rules).string = {
          min_len: 1
          max_len: 100
        }];

        string team_id = 2 [(validate.rules).string = {
          min_len: 1
          max_len: 100
        }];
      }
    }

    // A list of individual users to set access for.
    repeated .bitdrift.public.unary.admin.v1.SetAccessRequest.SetAccessPermission.Individual individuals = 1 [(validate.rules).repeated = {max_items: 100}];

    // A list of teams to set access for.
    repeated .bitdrift.public.unary.admin.v1.SetAccessRequest.SetAccessPermission.Team teams = 2 [(validate.rules).repeated = {max_items: 100}];

    // The access level to set for the entire organization.
    .bitdrift.public.unary.admin.v1.SetAccessRequest.SetAccessPermission.Org org = 3;

    // Only one entity with the owner level access will exist. i.e. a user reassigning their
    // owner access to a team, will no longer have owner access _unless_ they belong to that team.
    .bitdrift.public.unary.admin.v1.SetAccessRequest.SetAccessPermission.Owner owner = 4;
  }

  .bitdrift.public.unary.admin.v1.SetAccessRequest.SetAccessPermission access_permission = 1;

  oneof target {
    string dashboard_id = 2 [(validate.rules).string = {
      min_len: 1
      max_len: 100
    }];

    string view_id = 3 [(validate.rules).string = {
      min_len: 1
      max_len: 100
    }];

    string workflow_id = 4 [(validate.rules).string = {
      min_len: 1
      max_len: 100
    }];
  }
}

message SetAccessResponse {
  // The new access permissions for the updated entity.
  .bitdrift.public.unary.admin.v1.AccessPermission result = 1;
}
