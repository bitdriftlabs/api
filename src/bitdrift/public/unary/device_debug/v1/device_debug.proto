syntax = "proto3";

package bitdrift.public.unary.device_debug.v1;

import "bitdrift/public/shared/platform/v1/platform.proto";
import "bitdrift/public/unary/common/v1/common.proto";
import "bitdrift_public/protobuf/client/v1/api.proto";
import "bitdrift_public/protobuf/workflow/v1/workflow_command.proto";
import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// Reports result-upload progress when supplied by the device command.
//
// An attachment may be uploaded in one transfer or progressively in batches. Progress can advance
// in steps and does not expose a downloadable partial attachment. Use the command's terminal state,
// not byte-count equality, to determine completion. These counts are not the encoded download size.
message DeviceCommandProgress {
  // The number of result payload bytes persisted so far for commands that report byte progress.
  // Zero does not by itself mean that the command has no attachment.
  uint64 persisted_result_bytes = 1;

  // The expected result payload size, when reported. Omission means the total is unknown.
  optional uint64 total_result_bytes = 2;
}

// A command that can be executed on a device.
message DeviceCommand {
  // The opaque identifier of the command.
  string command_id = 1 [(validate.rules).string.uuid = true];

  // The ID of the device executing the command.
  string device_id = 2 [(validate.rules).string = {
    max_len: 36
    uuid: true
  }];

  // The command being executed, including the effective arguments captured at submission after
  // filling omitted keys from command defaults. Later definition changes do not alter these values.
  .bitdrift_public.protobuf.workflow.v1.WorkflowCommandSelector command = 3 [(validate.rules).message.required = true];

  // The time when the command was created.
  .google.protobuf.Timestamp created_at = 4 [(validate.rules).message.required = true];

  // The execution and result-upload deadline, not the attachment's deletion time. Successful results
  // can remain readable after this deadline, subject to history and attachment retention.
  .google.protobuf.Timestamp expires_at = 5 [(validate.rules).message.required = true];

  // Identity captured at submission; omitted for commands submitted before auditing was enabled.
  // API keys use the authenticated tenant API-key identity, not the key creator's identity.
  .bitdrift.public.unary.common.v1.Owner invoked_by = 6;

  // History visibility deadline under the account's current cold-storage retention policy.
  // Attachment deletion is asynchronous and may occur separately under the storage lifecycle.
  .google.protobuf.Timestamp retained_until = 7 [(validate.rules).message.required = true];
}

// Submits a command to a currently connected device without waiting for execution or result upload.
message SendDeviceCommandRequest {
  oneof target_type {
    option (validate.required) = true;
    // The device code that has already been exchanged via the /device/code API.
    string device_code = 1 [(validate.rules).string = {
      min_len: 6
      max_len: 6
    }];

    // The raw device ID.
    string device_id = 2 [(validate.rules).string = {
      max_len: 36
      uuid: true
    }];

    // The raw entity ID. Targets its sole currently connected device, falling back to devices
    // observed in the past 30 days. If multiple associated devices are online, the request fails
    // with their IDs.
    // Historical resolution does not guarantee current entity ownership. Commands stay scoped
    // to the selected device after resolution.
    string entity_id = 4 [(validate.rules).string = {
      min_len: 1
      max_len: 256
    }];

    // The hash of an entity ID returned by another API.
    string entity_hash = 5 [(validate.rules).string = {
      min_len: 1
      max_len: 256
    }];
  }

  // The command to execute.
  .bitdrift_public.protobuf.workflow.v1.WorkflowCommandSelector command = 3 [(validate.rules).message.required = true];
}

// Returns whether a device command was submitted, not whether it completed or uploaded an attachment.
message SendDeviceCommandResponse {
  message DeviceNotConnected {}

  oneof result {
    // The submitted command. Poll GetDeviceCommand with its command_id for completion.
    .bitdrift.public.unary.device_debug.v1.DeviceCommand device_command = 1;

    // The target device is not connected.
    .bitdrift.public.unary.device_debug.v1.SendDeviceCommandResponse.DeviceNotConnected device_not_connected = 2;
  }
}

// Requests a device command's current status without waiting for execution or upload to complete.
message GetDeviceCommandRequest {
  // The opaque identifier returned by SendDeviceCommand.
  string command_id = 1 [(validate.rules).string = {
    max_len: 36
    uuid: true
  }];
}

// Returns a snapshot of command state, upload progress, and terminal context, never attachment bytes.
//
// Poll while `pending`; stop on `succeeded`, `failed`, or `expired`. A successful command's declared
// attachment upload is complete, but optional server-side processing can still be pending.
message GetDeviceCommandResponse {
  // The command is awaiting execution, executing, or uploading its result. No partial attachment
  // can be downloaded, even when progress reports persisted bytes.
  message Pending {
    // The time when the command most recently changed state or progress.
    .google.protobuf.Timestamp updated_at = 1 [(validate.rules).message.required = true];
  }

  // Describes a command that completed successfully.
  //
  // Success confirms that any declared attachment is fully uploaded and persisted, whether uploaded
  // in one transfer or progressively. Its original logical contents are final and will not grow on
  // later retrievals. If `attachment` is omitted, the command completed without an attachment; do
  // not keep polling for one. `GetDeviceCommand` never returns attachment bytes.
  //
  // When `attachment` is present, download it with
  // `GET /v1/device-commands/{command_id}/attachment`, using `device_command.command_id` and the
  // same authentication as the public API. Download and status reads require `DEVICE_DEBUG`.
  // The download does not wait for execution, upload, or processing to finish.
  //
  // Append `?variant=raw` for the finalized original attachment, or assembled log JSON. This skips
  // optional processing, not the command-success requirement. Omit `variant` for the default
  // representation: an attachment without processing returns its original contents; an attachment
  // with processing returns the processed result when ready. Processing still pending returns
  // HTTP 409 with `Retry-After: 2` and a JSON `processing_state`. Failed processing returns a
  // command- or format-specific fallback with HTTP 200; it does not guarantee processed output.
  // `?variant=processed` requires processed output: HTTP 422 with `error_code` and `diagnostics`
  // on processing failure, or HTTP 404 when no processed representation exists. Consult the command
  // definition for result formats and fallback behavior; built-in commands are documented on
  // `WellKnownCommandType`.
  //
  // `GET /v1/device-commands/{command_id}/attachment/status` returns JSON with `kind`,
  // `processing_state` (`not_requested`, `pending`, `processing`, `ready`, or `failed`),
  // `raw_available`, `processed_available`, `partial`, `error_code`, and `diagnostics`.
  // HTTP 200 on this status route does not itself mean a download is ready; inspect availability.
  // `partial` describes processing quality, not an upload that is still growing.
  //
  // Download HTTP 409 without a processing response means the command is still pending; poll
  // `GetDeviceCommand` within a caller-chosen deadline. HTTP 404 can mean an unknown or unretained
  // command, failed or expired execution, no attachment, or attachment bytes no longer retained.
  // Status reads return HTTP 404 for unknown, unretained, failed, or expired commands; successful
  // commands without attachments instead return HTTP 200 with `raw_available: false`.
  // HTTP 400 means an invalid UUID or download variant; correct the request. HTTP 401 requires
  // authentication and HTTP 403 requires permission. These plain HTTP routes do not promise a
  // uniform JSON error body.
  //
  // Read the download's `Content-Type` and `Content-Encoding` to interpret the selected
  // representation. Honor `Content-Encoding`, including negotiated HTTP compression on JSON.
  // When `Content-Encoding: zstd` is present, decode exactly once; a response with no content
  // encoding needs no decompression. Artifact downloads include
  // `X-Bitdrift-Attachment-Disposition: raw` or `processed`; assembled log JSON need not.
  // Default, raw, and processed representations can differ. Finalized original contents are stable
  // while retained, but identical HTTP serialization, compression, or headers are not guaranteed.
  message Succeeded {
    // Metadata for a fully uploaded, finalized original attachment, not its bytes. Optional
    // processing can still be pending. Historical bytes may expire independently of this metadata.
    message Attachment {
      // The MIME type of the original attachment. The download's Content-Type identifies the
      // selected representation, which can differ after processing or a failure fallback.
      string content_type = 1 [(validate.rules).string.min_len = 1];
    }

    // Whether output was limited before completion. The returned attachment is final, not waiting
    // for additional bytes; repeating the download will not recover omitted output.
    bool output_truncated = 1;

    // The time when the command succeeded.
    .google.protobuf.Timestamp succeeded_at = 2 [(validate.rules).message.required = true];

    // Optional structured context supplied with the terminal command result.
    .bitdrift_public.protobuf.client.v1.DeviceCommandResultContext context = 3;

    // The finalized attachment metadata. Omission means no attachment, not an upload still pending.
    // Presence confirms completed upload, not completed processing or indefinite storage retention.
    // Downloading bytes no longer retained returns HTTP 404.
    .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse.Succeeded.Attachment attachment = 4;
  }

  // Describes a command that could not be completed.
  message Failed {
    // The time when the command failed.
    .google.protobuf.Timestamp failed_at = 1 [(validate.rules).message.required = true];

    // Optional structured context supplied with the terminal command result.
    .bitdrift_public.protobuf.client.v1.DeviceCommandResultContext context = 2;
  }

  // The execution deadline passed without a persisted terminal outcome.
  message Expired {
    .google.protobuf.Timestamp expired_at = 1 [(validate.rules).message.required = true];
  }

  // The immutable command metadata.
  .bitdrift.public.unary.device_debug.v1.DeviceCommand device_command = 1;

  // The command's latest reported result-upload progress, not attachment download readiness.
  .bitdrift.public.unary.device_debug.v1.DeviceCommandProgress progress = 2;

  oneof state {
    // The command is awaiting execution, executing, or uploading its result.
    .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse.Pending pending = 3;

    // The command completed successfully.
    .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse.Succeeded succeeded = 4;

    // The command could not be completed.
    .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse.Failed failed = 5;

    // Execution or upload expired. Recorded progress remains visible throughout history retention,
    // but incomplete attachment contents cannot be downloaded.
    .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse.Expired expired = 6;
  }
}

// Lists persisted direct submissions, not rejected attempts or SDK workflow executions.
// Results are newest first, ordered by creation time and command ID, within current cold retention.
message ListDeviceCommandInvocationsRequest {
  message Filters {
    optional string device_id = 1 [(validate.rules).string = {
      uuid: true
      max_len: 36
    }];

    // Exact match against the submission-time caller snapshot. Supply ID, email, or both (AND).
    // At least one must be nonempty; name and avatar_uri are not supported.
    .bitdrift.public.unary.common.v1.Owner invoked_by = 2;

    // Matches a selector only. Arguments are not permitted in a history filter.
    .bitdrift_public.protobuf.workflow.v1.WorkflowCommandSelector command = 3;

    // Inclusive creation-time bounds. Omission of the upper bound uses the first page's current time.
    .google.protobuf.Timestamp created_from = 4;

    .google.protobuf.Timestamp created_before = 5;
  }

  // Omission uses 50. Page size may change between pages; filters must remain unchanged.
  optional uint32 page_size = 1 [(validate.rules).uint32 = {
    gte: 1
    lte: 100
  }];

  // Opaque continuation token bound to this account and the original filters.
  string page_token = 2 [(validate.rules).string.max_len = 4096];

  .bitdrift.public.unary.device_debug.v1.ListDeviceCommandInvocationsRequest.Filters filters = 3;
}

message ListDeviceCommandInvocationsResponse {
  // Status and audit metadata only; attachment bytes are never included in a history page.
  repeated .bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse invocations = 1;

  string next_page_token = 2;
}

// Shared catalog metadata for built-in and registered commands.
message DeviceCommandMetadata {
  // The command key used for catalog lookup and as the client selector ID.
  string key = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];

  // An optional description of the command.
  optional string description = 2 [(validate.rules).string.max_len = 1000];

  // Arguments accepted by this command, including typed defaults. An empty list accepts no arguments.
  // A default satisfies an omitted required argument; explicit invocation values always win.
  repeated .bitdrift_public.protobuf.workflow.v1.DeviceCommandArgumentDefinition argument_definitions = 3 [(validate.rules).repeated.max_items = 50];
}

// A custom command registered for an account.
message RegisteredDeviceCommand {
  .bitdrift.public.unary.device_debug.v1.DeviceCommandMetadata metadata = 1 [(validate.rules).message.required = true];

  // Any platform may match; an empty list allows all devices. App versions are not supported.
  repeated .bitdrift.public.shared.platform.v1.Platform platform_targets = 2 [(validate.rules).repeated.max_items = 50];
}

// Creates or updates a registered command by key.
message RegisterDeviceCommandRequest {
  .bitdrift.public.unary.device_debug.v1.RegisteredDeviceCommand command = 1 [(validate.rules).message.required = true];
}

message RegisterDeviceCommandResponse {
  .bitdrift.public.unary.device_debug.v1.RegisteredDeviceCommand command = 1;
}

// A built-in command supported by the server.
message WellKnownDeviceCommand {
  .bitdrift_public.protobuf.workflow.v1.WellKnownCommandType type = 1 [(validate.rules).enum.defined_only = true];

  .bitdrift.public.unary.device_debug.v1.DeviceCommandMetadata metadata = 2 [(validate.rules).message.required = true];

  // Compatibility requirements, independent of account enablement. Direct invocations require a
  // matching connected SDK instance. Workflows are delivered only to compatible clients, including
  // the requirements of every supplied or default-filled argument; unsupported arguments are never
  // removed.
  // Each platform's minimum config version maps to the native SDK release's SemVer MINOR component.
  .bitdrift_public.protobuf.workflow.v1.DeviceCommandAvailability availability = 3 [(validate.rules).message.required = true];
}

// A command available in the account's catalog.
message DeviceCommandDefinition {
  oneof command_type {
    option (validate.required) = true;
    .bitdrift.public.unary.device_debug.v1.WellKnownDeviceCommand well_known = 1;

    .bitdrift.public.unary.device_debug.v1.RegisteredDeviceCommand registered = 2;
  }

  // Whether the command is enabled for this account. Built-in commands start disabled;
  // registered commands start enabled.
  bool enabled = 3;
}

message ListDeviceCommandsRequest {
  // Filters to apply when listing commands.
  message Filters {
    enum Category {
      CATEGORY_UNSPECIFIED = 0;
      REGISTERED = 1;
      WELL_KNOWN = 2;
    }

    // Matches registered keys or built-in command names beginning with this prefix, case-insensitively.
    optional string key_prefix = 1 [(validate.rules).string.max_len = 128];

    // Selects registered or built-in commands; unspecified includes both.
    .bitdrift.public.unary.device_debug.v1.ListDeviceCommandsRequest.Filters.Category category = 2 [(validate.rules).enum.defined_only = true];
  }

  // Omission uses the server's default page size.
  optional uint32 page_size = 1 [(validate.rules).uint32 = {
    gte: 1
    lte: 100
  }];

  string page_token = 2 [(validate.rules).string.max_len = 512];

  .bitdrift.public.unary.device_debug.v1.ListDeviceCommandsRequest.Filters filters = 3;
}

message ListDeviceCommandsResponse {
  repeated .bitdrift.public.unary.device_debug.v1.DeviceCommandDefinition commands = 1;

  string next_page_token = 2;
}

message SetDeviceCommandEnabledRequest {
  oneof command_type {
    option (validate.required) = true;
    // The built-in command to enable or disable.
    .bitdrift_public.protobuf.workflow.v1.WellKnownCommandType well_known_type = 1 [(validate.rules).enum.defined_only = true];

    // The key of a registered command to enable or disable.
    string registered_command_key = 2 [(validate.rules).string = {
      min_len: 1
      max_len: 128
    }];
  }

  bool enabled = 3;

  // Acknowledges the privacy notice below. Defaults to false; must be true when `enabled` is true
  // for a privacy-sensitive built-in command. Not required when disabling a command or enabling
  // a non-sensitive built-in or registered command.
  //
  // This command may collect personal or sensitive information. Before enabling it, make sure you
  // have permission to collect this information and obtain user consent where required.
  bool agree_to_privacy_sensitive_enable = 4;
}

message SetDeviceCommandEnabledResponse {
  .bitdrift.public.unary.device_debug.v1.DeviceCommandDefinition command = 1;
}

message UnregisterDeviceCommandRequest {
  string key = 1 [(validate.rules).string = {
    min_len: 1
    max_len: 128
  }];
}

// Returns whether a registered command was removed. Failures leave the command unchanged.
message UnregisterDeviceCommandResponse {
  // The registered command was removed.
  message Success {}

  // The registered command could not be removed.
  message Failure {
    // No registered command exists with the requested key.
    message NotFound {}

    // Saved workflows still reference the registered command.
    message WorkflowConflict {
      // The IDs of all referencing saved workflows, sorted by ID.
      repeated string workflow_ids = 1;
    }

    oneof reason {
      .bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandResponse.Failure.NotFound not_found = 1;

      .bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandResponse.Failure.WorkflowConflict workflow_conflict = 2;
    }
  }

  oneof result {
    .bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandResponse.Success success = 1;

    .bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandResponse.Failure failure = 2;
  }
}

// Manages device command execution and registered commands.
service DebugService {
  // Lists the account's retained direct command submissions, including expired execution attempts.
  rpc ListDeviceCommandInvocations(.bitdrift.public.unary.device_debug.v1.ListDeviceCommandInvocationsRequest) returns (.bitdrift.public.unary.device_debug.v1.ListDeviceCommandInvocationsResponse);

  // Sends a command to a currently connected device.
  //
  // The public API returns after submission, without waiting for device execution or result upload.
  // Save `device_command.command_id` and poll `GetDeviceCommand`; do not resubmit to check progress.
  // A returned command ID does not guarantee completion or the presence of an attachment.
  rpc SendDeviceCommand(.bitdrift.public.unary.device_debug.v1.SendDeviceCommandRequest) returns (.bitdrift.public.unary.device_debug.v1.SendDeviceCommandResponse);

  // Retrieves the state and available results of a device command.
  //
  // Returns the current snapshot without waiting for execution, upload, or processing. Poll while
  // `pending` using a caller-chosen interval and deadline. `failed` and `expired` are terminal.
  // When `succeeded.attachment` is present, its original upload is complete and finalized; fetch
  // bytes with `GET /v1/device-commands/{command_id}/attachment?variant=raw`, substituting
  // `device_command.command_id`. No further upload polling is needed. Optional processing is a
  // separate stage: inspect `GET /v1/device-commands/{command_id}/attachment/status` or handle
  // HTTP 409 with `Retry-After` on the default download. See `GetDeviceCommandResponse.Succeeded`
  // for variants, download headers, and HTTP 4xx meanings. Success without `attachment` means there
  // is nothing to download. This method never includes attachment bytes or tracks workflow commands.
  rpc GetDeviceCommand(.bitdrift.public.unary.device_debug.v1.GetDeviceCommandRequest) returns (.bitdrift.public.unary.device_debug.v1.GetDeviceCommandResponse);

  // Creates or updates a registered command by key.
  //
  // This operation is an upsert. New commands start enabled; updating an existing command preserves
  // its enabled state.
  rpc RegisterDeviceCommand(.bitdrift.public.unary.device_debug.v1.RegisterDeviceCommandRequest) returns (.bitdrift.public.unary.device_debug.v1.RegisterDeviceCommandResponse);

  // Lists built-in and registered commands, including disabled commands.
  rpc ListDeviceCommands(.bitdrift.public.unary.device_debug.v1.ListDeviceCommandsRequest) returns (.bitdrift.public.unary.device_debug.v1.ListDeviceCommandsResponse);

  // Enables or disables a built-in or registered command for this account.
  //
  // Enabling a privacy-sensitive built-in command requires
  // `agree_to_privacy_sensitive_enable` to be true, including when it is already enabled.
  rpc SetDeviceCommandEnabled(.bitdrift.public.unary.device_debug.v1.SetDeviceCommandEnabledRequest) returns (.bitdrift.public.unary.device_debug.v1.SetDeviceCommandEnabledResponse);

  // Removes a registered command that is not referenced by any saved workflow.
  //
  // Returns a structured failure when the command does not exist or saved workflows reference it.
  // Workflow conflicts include all referencing workflow IDs. Failures leave the command unchanged.
  rpc UnregisterDeviceCommand(.bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandRequest) returns (.bitdrift.public.unary.device_debug.v1.UnregisterDeviceCommandResponse);
}
